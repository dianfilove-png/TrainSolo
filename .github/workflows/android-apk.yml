name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: |
          ./gradlew assembleRelease
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/TrainSolo.apk
          ls -la apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrainSolo-apk
          path: apk/TrainSolo.apk

      # Для тегов вида v2.0.1 APK прикрепляется к релизу — его удобно скачать прямо с телефона.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/TrainSolo.apk
