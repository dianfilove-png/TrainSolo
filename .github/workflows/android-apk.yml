name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test -- --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Отдельный APK под каждую архитектуру — так каждый файл примерно вдвое меньше универсального.
      - name: Build APKs
        working-directory: android
        run: |
          mkdir -p ../apk
          for abi in arm64-v8a armeabi-v7a; do
            ./gradlew assembleRelease -PreactNativeArchitectures=$abi -Pexpo.useLegacyPackaging=true --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../apk/TrainSolo-$abi.apk
          done
          ls -la ../apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrainSolo-apk
          path: apk/*.apk

      # Для тегов вида v1.0.1 APK прикрепляются к релизу — их удобно скачать прямо с телефона.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
